---
# roles/reverse_proxy/tasks/fragment_render.yml
#
# Rôle (04E § 7.3, § 8.3, § 8.4 ; 06B v0.2 EPIC-03 — T3.1.1bis, T3.1.2, T3.1.3,
# F3.2) : rendu complet d'un fragment de service publié (toutes ses routes
# courantes, dans l'ordre déclaré) via templates/fragment.caddy.j2, avec
# en-tête auto-descriptif, sous le nom déterministe
# <project_name>__<service_id>.caddy — un fragment par service publié,
# jamais par route (04E § 8.3, § 15).
#
# Appelé par : tasks/candidate_build.yml, dans les deux modes de convergence
# (main.yml, converge_route.yml) — une fois par service publié à régénérer.
#
# Entrées attendues (définies par l'appelant avant chaque inclusion) :
#   fragment_project_name : project_name de la fiche (04E § 6.11 : [a-z0-9-]+)
#   fragment_domain       : domain de la fiche
#   fragment_service      : un élément de published_services[] (service_id,
#                            listen_port, frontend_protocol, routes[])
# Précondition (rôle/inventaire) :
#   caddy_candidate_dir   : répertoire candidat déjà construit par
#                            candidate_build.yml (non créé ici)
#   preflight_git_sha     : SHA HEAD capturé par preflight.yml (source-commit)
#   environment_name      : inventaire (utilisé pour le commentaire d'en-tête)
#
# Sortie : {{ caddy_candidate_dir }}/<project_name>__<service_id>.caddy

- name: Vérifier le format des identifiants source du fragment à générer
  ansible.builtin.assert:
    that:
      - fragment_project_name is defined
      - fragment_project_name is match('^[a-z0-9-]+$')
      - fragment_service is defined
      - fragment_service.service_id is defined
      - fragment_service.service_id is match('^[a-z0-9-]+$')
      - caddy_candidate_dir is defined
      - caddy_candidate_dir | length > 0
      - preflight_git_sha is defined
    fail_msg: >-
      fragment_render.yml : identifiant source hors format [a-z0-9-]+ ou
      variable requise manquante — échec avant toute génération (04E § 6.11,
      § 8.3, T3.1.3).

- name: Calculer le nom déterministe du fragment
  ansible.builtin.set_fact:
    fragment_filename: "{{ fragment_project_name }}__{{ fragment_service.service_id }}.caddy"
    fragment_generated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    fragment_source_commit: "{{ preflight_git_sha }}"

- name: Rendre le fragment de service dans l'espace candidat
  ansible.builtin.template:
    src: fragment.caddy.j2
    dest: "{{ caddy_candidate_dir }}/{{ fragment_filename }}"
    mode: "0644"
  become: true
