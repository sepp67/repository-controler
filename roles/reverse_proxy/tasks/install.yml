---
# roles/reverse_proxy/tasks/install.yml
#
# Rôle (04E § 7.1, § 7.3, § 8.1, § 8.2 ; 06B v0.2 T2.1.1, T2.2.2bis) :
#   - vérifie que la cible est Debian ou Ubuntu, échoue explicitement sinon
#     (04E § 3.1, ARCH-CAND-027) — aucune autre distribution n'est supportée
#     en V1, SELinux hors périmètre ;
#   - installe le paquet Caddy (dépôt officiel Caddy, absent des dépôts
#     Debian/Ubuntu standards) et active le service systemd ;
#   - crée caddy_conf_d_dir et dépose le fichier principal Caddy, statique,
#     qui importe uniquement conf.d/*.caddy (04E § 8.2).
#
# N'installe et ne configure que Caddy lui-même — ne dépose aucun fragment de
# service (rôle de fragment_render.yml/candidate_*.yml, EPIC-03/EPIC-04) et
# n'écrit jamais dans registry/.
#
# Appelé par : tasks/main.yml uniquement (04E § 7.3) — jamais par
# tasks/converge_route.yml, qui suppose Caddy déjà installé.
# Précondition : caddy_conf_d_dir est défini (rôle defaults, T2.2.3).

- name: Vérifier que la cible est Debian ou Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    fail_msg: >-
      Système non supporté ({{ ansible_facts['distribution'] | default('inconnu') }}) :
      la V1 du rôle reverse_proxy supporte exclusivement Debian et Ubuntu,
      SELinux est hors périmètre (04E § 3.1, ARCH-CAND-027).
    success_msg: "Système supporté : {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}."

- name: Installer les prérequis de gestion du dépôt APT Caddy
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
      - gnupg
    state: present
    update_cache: true
  become: true

- name: Créer le répertoire des trousseaux APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Télécharger la clé GPG du dépôt officiel Caddy
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"
  become: true

- name: Déclarer le dépôt APT officiel Caddy
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    filename: caddy-stable
    state: present
  become: true

- name: Installer le paquet Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true
  become: true

- name: Créer caddy_conf_d_dir
  ansible.builtin.file:
    path: "{{ caddy_conf_d_dir }}"
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"
  become: true

- name: Vérifier la cohérence de caddy_tls_mode (04E § 10.1, § 10.3)
  ansible.builtin.assert:
    that:
      - caddy_tls_mode in ['internal', 'acme']
      - caddy_tls_mode != 'acme' or caddy_acme_email is defined
    fail_msg: >-
      caddy_tls_mode doit valoir 'internal' (staging, § 10.1) ou 'acme'
      (production, § 10.3) ; en mode 'acme', caddy_acme_email est obligatoire
      (contact ACME, § 7.4).

- name: Déposer le fichier principal Caddy
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: caddy
    group: caddy
    mode: "0644"
    validate: "caddy validate --config %s --adapter caddyfile"
  become: true

- name: S'assurer que le service Caddy est actif et activé au démarrage
  ansible.builtin.systemd:
    name: caddy
    state: started
    enabled: true
  become: true
