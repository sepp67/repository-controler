---
# Migré depuis vars/projects/element-web.yml (devops_staging_prod_infra,
# inventories/production/group_vars/all/main.yml). Valeurs réelles, non
# marquées TODO dans le dépôt source.
project_name: element-web
domain: element.lavallee.tech

published_services:
  - service_id: web
    listen_port: 443
    frontend_protocol: https
    routes:
      - route_id: default
        path: /
        handler: reverse_proxy
        backends:
          - backend_id: primary
            host: 192.168.1.84
            target_port: 8080
