---
# Migré et fusionné depuis vars/projects/matrix-users.yml et
# vars/projects/matrix-users-federation.yml (devops_staging_prod_infra,
# inventories/production/group_vars/all/main.yml). Valeurs réelles, non
# marquées TODO dans le dépôt source.
#
# Comme en staging : client ET fédération partagent le même port backend
# (matrix_users_http_port = 8008), seul le port d'écoute Caddy diffère.
project_name: matrix-users
domain: matrix-users.lavallee.tech

published_services:
  - service_id: matrix-client
    listen_port: 443
    frontend_protocol: https
    routes:
      - route_id: default
        path: /
        handler: reverse_proxy
        backends:
          - backend_id: primary
            host: 192.168.1.81
            target_port: 8008

  - service_id: matrix-federation
    listen_port: 8448
    frontend_protocol: https
    routes:
      - route_id: default
        path: /
        handler: reverse_proxy
        backends:
          - backend_id: primary
            host: 192.168.1.81
            target_port: 8008
