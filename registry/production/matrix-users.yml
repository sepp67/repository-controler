---
# Migré et fusionné depuis vars/projects/matrix-users.yml et
# vars/projects/matrix-users-federation.yml (devops_staging_prod_infra) :
# résout définitivement ARB-001 / Q-001 (04D), conforme à 04E § 6.12.6.
#
# Donnée réelle importante, différente de l'exemple illustratif de 04E :
# le homeserver Synapse expose client ET fédération sur le MÊME port
# backend (matrix_users_http_port = 8008) — seul le port d'écoute Caddy
# diffère (443 vs 8448), pas le port du backend.
project_name: matrix-users
domain: matrix-users.lavallee.tech

published_services:
  - service_id: matrix-client
    listen_port: 443
    frontend_protocol: https
    routes:
      - route_id: default
        path: /
        handler: reverse_proxy
        backends:
          - backend_id: primary
            host: 192.168.1.20
            target_port: 8008

  - service_id: matrix-federation
    listen_port: 8448
    frontend_protocol: https
    routes:
      - route_id: default
        path: /
        handler: reverse_proxy
        backends:
          - backend_id: primary
            host: 192.168.1.78
            target_port: 8008
