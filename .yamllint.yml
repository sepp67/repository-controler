---
# Configuration yamllint — validation de forme du registre et des inventaires
# (04E § 20, 06B v0.2 T1.2.3, F9.1).

extends: default

rules:
  line-length: disable
  document-start: enable
  truthy:
    allowed-values: ["true", "false"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  indentation:
    indent-sequences: consistent
